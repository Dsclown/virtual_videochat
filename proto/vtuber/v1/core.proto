syntax = "proto3";

package vtuber.v1;

// Gateway ↔ Core 双向会话（持续 PCM 进、媒体+事件出）
service VtuberCore {
  rpc ConnectSession(stream GatewayToCore) returns (stream CoreToGateway);
}

message GatewayToCore {
  string session_id = 1;
  oneof payload {
    OpenSession open = 10;
    AudioPcm audio = 11;
    CloseSession close = 12;
    Ping ping = 13;
    ResetMemory reset = 14;
    UserText user_text = 15;
  }
}

message CoreToGateway {
  string session_id = 1;
  oneof payload {
    SessionReady ready = 10;
    CoreEvent event = 11;
    MediaOut media = 12;
    Pong pong = 13;
    Error error = 14;
  }
}

message OpenSession {
  string user_id = 1;
  string platform = 2;
}

message CloseSession {}

message Ping {}

message Pong {}

message ResetMemory {}

message UserText {
  string text = 1;
}

message AudioPcm {
  uint32 sample_rate = 1;
  bytes pcm_f32le = 2;
}

message SessionReady {
  bool vad_enabled = 1;
  bool avatar_enabled = 2;
}

message CoreEvent {
  string type = 1;
  string text = 2;
  uint32 turn_id = 3;
  string assistant_delta = 4;
}

// 同一 tick 的音视频帧（可只填其一；常规为两者同时携带）
message MediaOut {
  optional VideoRgb video = 1;
  optional AudioPcm48 audio = 2;
}

message VideoRgb {
  uint32 width = 1;
  uint32 height = 2;
  bytes rgb24 = 3;
}

message AudioPcm48 {
  bytes pcm_s16le = 1;
}

message Error {
  string message = 1;
}
